  <text x="280" y="220" font-family="'Fraunces', Georgia, serif" font-size="76" font-weight="900" fill="#2C2623">Budol<tspan fill="#3E5634">Check</tspan></text>
  <text x="285" y="275" font-family="'Inter', sans-serif" font-size="28" font-weight="600" fill="#789668" letter-spacing="1">CHECK FIRST. BUDOL LATER.</text>
